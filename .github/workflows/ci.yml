name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv || true
          if command -v uv; then
            uv pip install -e .
            uv pip install pytest
          else
            pip install -e .
            pip install pytest
          fi
      - name: Run tests
        run: |
          if command -v uv; then
            uv run pytest -q
          else
            pytest -q
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install black
        run: |
          python -m pip install --upgrade pip
          pip install uv || true
          if command -v uv; then
            uv pip install black
          else
            pip install black
          fi
      - name: Check formatting
        run: |
          if command -v uv; then
            uv run black --check .
          else
            black --check .
          fi
