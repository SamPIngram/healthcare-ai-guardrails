name: Publish to PyPI

on:
  release:
    types: [created]

jobs:
  tests:
    uses: ./.github/workflows/test-suite.yml

  update-metadata:
    runs-on: ubuntu-latest
    needs: tests
    outputs:
      updated_sha: ${{ steps.commit_and_push.outputs.sha }}
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Derive version from tag
        id: get_version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          # strip leading 'v' if present
          VER="${TAG#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Update pyproject.toml version
        run: |
          ver='${{ steps.get_version.outputs.version }}'
          echo "Bumping pyproject.toml to version $ver"
          sed -i -E "s/^version = \".*\"/version = \"${ver}\"/" pyproject.toml
      - name: Update CHANGELOG.md
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          ver='${{ steps.get_version.outputs.version }}'
          rel_date="$(date -u +%Y-%m-%d)"
          # Strip carriage returns from release body (GitHub web UI uses CRLF)
          notes="$(printf '%s' "$RELEASE_NOTES" | tr -d '\r')"
          header="## v${ver} - ${rel_date}"
          tmp=$(mktemp)
          {
            echo "$header";
            echo "";
            if [ -n "$notes" ]; then printf '%s\n' "$notes"; else echo "Release v${ver}."; fi;
            echo "";
            if [ -f CHANGELOG.md ]; then cat CHANGELOG.md; fi
          } > "$tmp"
          mv "$tmp" CHANGELOG.md
      - name: Commit and push changes
        id: commit_and_push
        run: |
          ver='${{ steps.get_version.outputs.version }}'
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add pyproject.toml CHANGELOG.md
            git commit -m "chore(release): v${ver} [skip ci]"
            git push
          fi
          # Expose the SHA that will be used for building
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: update-metadata
    steps:
      - uses: actions/checkout@v4
        with:
          # Build from the exact commit that has updated version/changelog
          ref: ${{ needs.update-metadata.outputs.updated_sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install build
      - name: Derive version for artifact name
        id: get_version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Build package
        run: python -m build
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-${{ steps.get_version.outputs.version }}
          path: dist/

  publish-to-pypi:
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/healthcare-ai-guardrails
    permissions:
      id-token: write
    steps:
      - name: Derive version for artifact name
        id: get_version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions-${{ steps.get_version.outputs.version }}
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
